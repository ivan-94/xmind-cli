[dependencies]
clap = { version = "=4.5.4", features = ["derive"] }
clap_complete = "=4.5.2"
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
serde_yaml = "=0.9.34"
sha2 = "=0.10.8"
thiserror = "=1.0.61"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }

# Keep serde_yaml's indexmap stack compatible with Cargo/Rust 1.80.
indexmap = "=2.2.6"
hashbrown = "=0.14.5"

[dev-dependencies]
assert_cmd = "=2.0.14"
predicates = "=3.1.0"
tempfile = "=3.10.1"
insta = { version = "=1.39.0", features = ["json"] }
proptest = "=1.4.0"

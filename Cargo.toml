[package]
name = "xmind-cli"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Agent-native CLI for inspecting and editing XMind workbooks"
repository = "https://github.com/ivan-94/xmind-cli"
homepage = "https://github.com/ivan-94/xmind-cli"
publish = false

[package.metadata.dist]
dist = true

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
# Source Manifest: GitHub issues #5 and #6, parent PRD #1, PLAN.md Phase 18, docs/technical/release-policy.md, docs/installation.md, CHANGELOG.md.
# Keep release automation to GitHub Release archives/checksums plus platform smoke checks.
# Homebrew tap publication is handled by the checked-in release workflow and script.
cargo-dist-version = "0.31.0"
allow-dirty = ["ci"]
ci = ["github"]
hosting = ["github"]
installers = []
checksum = "sha256"
create-release = true
pr-run-mode = "plan"
unix-archive = ".tar.gz"
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]

[package.metadata.xmind-cli]
spec_sources = [
  "docs/README.md",
  "docs/product",
  "docs/concepts",
  "docs/reference",
  "docs/schemas",
  "docs/technical",
]

[[bin]]
name = "xmind"
path = "src/main.rs"


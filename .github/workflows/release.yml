# This workflow is managed as the cargo-dist contract for GitHub issues #5 and #6.
# Source Manifest: https://github.com/ivan-94/xmind-cli/issues/5, parent PRD
# https://github.com/ivan-94/xmind-cli/issues/1,
# https://github.com/ivan-94/xmind-cli/issues/6,
# https://github.com/ivan-94/xmind-cli/issues/8, PLAN.md Phase 18,
# Cargo.toml [workspace.metadata.dist], docs/technical/release-policy.md,
# docs/installation.md, CHANGELOG.md.
name: Release

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  dist-plan:
    name: cargo-dist plan
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ steps.plan.outputs.tag }}
      releasing: ${{ steps.plan.outputs.releasing }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install cargo-dist
        uses: axodotdev/cargo-dist@v0.31.0

      - name: Plan release
        id: plan
        run: dist plan --output-format=json

  dist-build:
    name: cargo-dist build ${{ matrix.target }}
    needs: dist-plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            binary: ./target/aarch64-apple-darwin/release/xmind
          - target: x86_64-apple-darwin
            os: macos-15-intel
            binary: ./target/x86_64-apple-darwin/release/xmind
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: ./target/x86_64-unknown-linux-gnu/release/xmind
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: ./target/x86_64-pc-windows-msvc/release/xmind.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain from rust-toolchain.toml
        run: rustup show

      - name: Install cargo-dist
        uses: axodotdev/cargo-dist@v0.31.0

      - name: Build release artifacts
        run: dist build --target=${{ matrix.target }} --artifacts=local

      - name: Smoke release binary
        run: |
          ${{ matrix.binary }} --version
          ${{ matrix.binary }} tree tests/fixtures/xmind/minimal.xmind --json
          ${{ matrix.binary }} validate tests/fixtures/xmind/minimal.xmind --json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: target/distrib/*
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs:
      - dist-plan
      - dist-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: target/distrib
          merge-multiple: true

      - name: Generate aggregate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd target/distrib
          mapfile -t artifacts < <(find . -maxdepth 1 -type f ! -name 'SHA256SUMS' ! -name '*.sha256' -exec basename {} \; | sort)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No release archives found for SHA256SUMS generation" >&2
            exit 1
          fi
          : > SHA256SUMS
          for artifact in "${artifacts[@]}"; do
            shasum -a 256 "$artifact" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/distrib/*
          generate_release_notes: false
          body_path: CHANGELOG.md
